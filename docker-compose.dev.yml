name: mental-health-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentalhealth
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d mentalhealth']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_node_modules:
  client_node_modules:
  admin_node_modules:
